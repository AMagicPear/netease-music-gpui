    <!-- 白色实心日历。日期不是画在它上面的文字，而是从本体上「挖掉」的一块：
         遮罩里铺满白色（全显示），当日数字用黑色画进去（全隐藏），
         两者相乘得到「日历减去数字」的形状，数字处因此透出封面。
         下面那张 mask 末尾的注释标记是数字的插入点，由 recommend.rs 在渲染前
         替换成一段 <text>；没有替换时遮罩只剩白底，图标就是完整的实心日历。 -->
    <defs>
        <mask id="date-cut" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse"
              x="0" y="0" width="22" height="22">
            <rect x="0" y="0" width="22" height="22" fill="#fff"/>
            <!--DATE_TEXT-->
        </mask>
    </defs>
