[package]
name = "netease-music-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8" }
reqwest-client = { package = "gpui-pre-reqwest-client", version = "=0.3.8" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", default-features = false, features = [
    "component",
] }
# 本地 vendor：fork 仓库 https://github.com/AMagicPear/ncm-api-rs（git submodule）。
# 分支 fix/captcha-login-and-deps：修了验证码登录 password 字段的 bug（upstream issue #5）
# 并把 rand/base64/md-5 升级到与主项目一致的版本去重。上游合并后可切回官方仓库。
ncm-api-rs = { path = "vendor/ncm-api-rs" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["local-offset"] }
# 跟随 ncm-api-rs 的 reqwest 0.12
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
cpal = "0.17.3"
symphonia = { version = "0.5.5", default-features = false, features = ["flac", "mp3", "aac", "isomp4", "ogg", "vorbis", "wav", "pcm", "alac"] }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
anyhow = "1"
log = "0.4"
tracing-subscriber = "0.3"
# 用于随机播放；gpui 依赖同一版本
rand = "0.9"
sha2 = "0.10"
# 解析网页「点击打开客户端」按钮的 orpheus:// 唤起链接（base64 载荷）。
# ncm-api-rs 已带入同一版本，不新增下载。
base64 = "0.22"
tempfile = "3"
smallvec = "1"
# 二维码编码；SVG 直接交给 GPUI 渲染，不需要图像编码依赖。
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62.2", features = ["Foundation", "Media", "Storage_Streams", "Win32_System_WinRT"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSView", "NSWindow", "NSControl", "NSButton", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSGraphics", "NSStatusItem", "NSStatusBarButton"] }

[dev-dependencies]
futures = "0.3"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
