[package]
name = "netease-music-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8" }
reqwest-client = { package = "gpui-pre-reqwest-client", version = "=0.3.8" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", default-features = false, features = [
    "component",
] }
ncm-api-rs = { git = "https://github.com/SPlayer-Dev/ncm-api-rs.git" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["local-offset"] }
# 跟随 ncm-api-rs 的 reqwest 0.12
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
cpal = "0.17.3"
symphonia = { version = "0.5.5", default-features = false, features = ["flac", "mp3", "aac", "isomp4", "ogg", "vorbis", "wav", "pcm", "alac"] }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
anyhow = "1"
# 用于随机播放；gpui 依赖同一版本
rand = "0.9"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSView", "NSWindow", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSGraphics", "NSStatusItem", "NSStatusBarButton", "NSButton"] }

[dev-dependencies]
futures = "0.3"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
